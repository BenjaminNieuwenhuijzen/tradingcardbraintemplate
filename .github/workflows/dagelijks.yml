name: TradingCardBrain dagelijkse run

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      grote_wijziging:
        description: "Vink alleen aan als je collectie echt veel kleiner is geworden"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: tradingcardbrain
  cancel-in-progress: false

jobs:
  run:
    if: github.repository != 'BenjaminNieuwenhuijzen/tradingcardbraintemplate'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Eigen gegevens ophalen
        uses: actions/checkout@v7

      - name: Nieuwste versie binnen hoofdversie 1 zoeken
        id: engine
        run: |
          tag=$(git ls-remote --tags --refs https://github.com/BenjaminNieuwenhuijzen/tradingcardbrain 'v1' 'v1.*' | sed 's#.*refs/tags/##' | sort -V | tail -n 1)
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Engine ophalen
        uses: actions/checkout@v7
        with:
          repository: BenjaminNieuwenhuijzen/tradingcardbrain
          ref: ${{ steps.engine.outputs.tag }}
          path: .engine

      - name: Python klaarzetten
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Collectie en dashboard bijwerken
        id: brain
        continue-on-error: true
        env:
          GROTE_WIJZIGING: ${{ inputs.grote_wijziging }}
        run: |
          extra=""
          if [ "$GROTE_WIJZIGING" = "true" ]; then extra="--allow-shrink"; fi
          python .engine/scripts/run.py daily --home . $extra

      - name: Resultaat bewaren
        run: |
          git config user.name "tradingcardbrain bot"
          git config user.email "tradingcardbrain@users.noreply.github.com"
          git add config data site
          if git diff --cached --quiet; then
            echo "Niets nieuws om te bewaren."
          else
            git commit -m "Dagelijkse update"
            git push
          fi

      - name: Melden als er iets misging
        if: steps.brain.outcome == 'failure'
        run: |
          echo "::error::De run is niet goed gegaan. De reden staat bij de stap Collectie en dashboard bijwerken en op je dashboard."
          exit 1
